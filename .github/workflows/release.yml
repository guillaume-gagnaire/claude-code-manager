name: Release

# Push a tag `vX.Y.Z` (after `node scripts/version.mjs X.Y.Z` and a commit) to publish a
# release: NSIS installer + signed updater artifacts + latest.json for the in-app updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: node scripts/version.mjs --check ${{ github.ref_name }}

      # Created before the long build, while the tag is still the head of main: once main has moved
      # past it, GITHUB_TOKEN may no longer create the release ("Resource not accessible by
      # integration", it would need the `workflows` permission it cannot have). tauri-action then
      # finds this release and only uploads the installer, its signature and latest.json to it.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "Claude Code Manager $TAG" \
            --notes "Voir les commits depuis la version précédente." "${flags[@]}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (pinned in src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: |
          npm test
          cd src-tauri
          cargo test

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Code Manager ${{ github.ref_name }}
          releaseBody: Voir les commits depuis la version précédente.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
